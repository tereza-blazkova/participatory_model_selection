[project]
name = "ews-modeling"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # FasterRisk 0.1.10 calls ndarray.tostring, removed in numpy 2.3.
    # Run `python -m models.fasterrisk_model` to check a new environment.
    "numpy==2.2.6",
    "pandas>=2.0",
    "scikit-learn==1.8.0",
    "scipy",
    "matplotlib",
    "pyarrow",
    "xgboost==3.2.0",
    "torch",              # models/mlp_model.py
    "joblib",
    "plotly",
    "graphviz",
    "packaging",
    "requests",           # needed by fasterrisk, which is installed with --no-deps
    # fasterrisk==0.1.10 is installed separately with --no-deps: see README.md.
    "optuna==4.8.0",
    "shap",               # src/shap_plots.py
]
